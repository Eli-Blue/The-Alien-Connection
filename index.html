<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Alien Connection // Station Echo-7</title>
    <meta
      name="description"
      content="A retro sci-fi mystery adventure and puzzle game set in an abandoned sub-surface radio astronomy array."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300ff88'/><circle cx='50' cy='50' r='20' fill='%230a1012'/></svg>" />
    <style>
      :root {
        --crt-amber: #ffb833;
        --crt-green: #33ff88;
        --crt-cyan: #33d4ff;
        --crt-bg: #070b0e;
        --crt-panel: #0d151a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: var(--crt-bg);
        color: #d0e0e3;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #game-wrapper {
        position: relative;
        width: 1024px;
        height: 700px;
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
        border: 2px solid #1a2a32;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      /* CRT Scanline & vignette overlay effect */
      .crt-overlay {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          rgba(18, 26, 22, 0) 50%,
          rgba(0, 0, 0, 0.28) 50%
        ),
        radial-gradient(circle, rgba(0,0,0,0) 65%, rgba(0,0,0,0.65) 100%);
        background-size: 100% 4px, 100% 100%;
        z-index: 99;
        mix-blend-mode: multiply;
      }
      .crt-flicker {
        pointer-events: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.015);
        z-index: 100;
        animation: subtle-flicker 0.15s infinite;
      }
      @keyframes subtle-flicker {
        0% { opacity: 0.85; }
        50% { opacity: 1.0; }
        100% { opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game-container"></div>
      <div class="crt-overlay"></div>
      <div class="crt-flicker"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
